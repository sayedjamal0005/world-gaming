<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Gaming</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }
        .app-container {
            width: 100%;
            max-width: 480px;
            padding: 16px;
            display: flex;
            flex-direction: column;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 12px;
            border-bottom: 1px solid #ff9900;
            margin-bottom: 30px;
        }
        .logo {
            color: #ff9900;
            font-size: 20px;
            font-weight: bold;
        }
        .balance-box {
            background-color: #ff9900;
            color: #000000;
            padding: 6px 14px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 15px;
        }
        .welcome-section {
            text-align: center;
            margin-bottom: 24px;
        }
        .welcome-title {
            color: #ff9900;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .welcome-subtitle {
            color: #cccccc;
            font-size: 14px;
        }
        .grid-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 24px;
        }
        .game-card {
            background-color: #222222;
            border: 1px solid #333333;
            border-radius: 8px;
            padding: 16px 12px;
            text-align: center;
            text-decoration: none;
            color: #ffffff;
            font-size: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: border-color 0.2s, background-color 0.2s;
            cursor: pointer;
        }
        .game-card:hover, .game-card:active {
            border-color: #ff9900;
            background-color: #2a2a2a;
        }
        .wallet-card {
            border-color: #ff9900;
        }
        .logout-btn {
            width: 100%;
            background-color: #333333;
            color: #ffffff;
            border: none;
            padding: 14px;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            display: block;
        }
        .logout-btn:hover {
            background-color: #444444;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header">
            <div class="logo">World Gaming</div>
            <!-- Initial balance default is 0.00 -->
            <div class="balance-box" id="balanceDisplay">Rs. 0.00</div>
        </div>

        <div class="welcome-section">
            <h1 class="welcome-title">Welcome, jamalshah!</h1>
            <p class="welcome-subtitle">Your Account is Active & Ready to Play.</p>
        </div>

        <div class="grid-container">
            <a href="aviator.html" class="game-card">
                <span>🎮</span> Aviator
            </a>
            <a href="ludo.html" class="game-card">
                <span>🎲</span> Ludo King
            </a>
            <a href="toss.html" class="game-card">
                <span>🪙</span> Toss Game
            </a>
            <a href="easypaisa.html" class="game-card wallet-card">
                <span>💳</span> EasyPaisa Wallet
            </a>
        </div>

        <button class="logout-btn" onclick="alert('Logging out...')">Logout</button>
    </div>

    <script>
        // Load initial balance or get from localStorage
        const userBalance = localStorage.getItem('user_balance') || "0.00";
        document.getElementById('balanceDisplay').innerText = `Rs. ${parseFloat(userBalance).toFixed(2)}`;
    </script>
</body>
</html>
