<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Gaming - Login & Dashboard</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        .header {
            background-color: #1a1a1a;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #ff9900;
        }
        .header h1 {
            color: #ff9900;
            margin: 0;
            font-size: 20px;
        }
        .wallet {
            background-color: #ff9900;
            color: #000;
            padding: 5px 12px;
            font-weight: bold;
            border-radius: 4px;
        }
        .container {
            max-width: 400px;
            margin: 50px auto;
            background: #1e1e1e;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        h2 {
            color: #ff9900;
            margin-bottom: 20px;
            text-align: center;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #bbb;
        }
        input {
            width: 100%;
            padding: 12px;
            background: #2a2a2a;
            border: 1px solid #444;
            color: #fff;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .btn {
            width: 100%;
            padding: 12px;
            background: #ff9900;
            border: none;
            color: #000;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
            font-size: 16px;
        }
        .btn:hover {
            background: #e68a00;
        }
        .dashboard {
            display: none;
            text-align: center;
            padding: 20px;
        }
        .game-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 20px;
        }
        .game-card {
            background: #252525;
            padding: 20px;
            border-radius: 6px;
            border: 1px solid #444;
            cursor: pointer;
        }
        .game-card:hover {
            border-color: #ff9900;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>World Gaming</h1>
        <div class="wallet" id="wallet-balance">Rs. 0.00</div>
    </div>

    <!-- Login Section -->
    <div class="container" id="login-container">
        <h2>Account Login</h2>
        <form id="login-form" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" placeholder="Enter username" required>
            </div>
            <div class="form-group">
                <label>Phone Number (EasyPaisa)</label>
                <input type="text" id="phone" placeholder="03XXXXXXXXX" required>
            </div>
            <button type="submit" class="btn">Login / Register</button>
        </form>
    </div>

    <!-- Dashboard Section -->
    <div class="container dashboard" id="dashboard-container">
        <h2>Welcome, <span id="user-display"></span>!</h2>
        <p>Your Account is Active & Ready to Play.</p>
        <div class="game-grid">
            <div class="game-card" onclick="alert('Starting Game 1!')">🎮 Aviator</div>
            <div class="game-card" onclick="alert('Starting Game 2!')">🎲 Ludo King</div>
            <div class="game-card" onclick="alert('Starting Game 3!')">🪙 Toss Game</div>
            <div class="game-card" onclick="alert('Opening Deposit/Withdraw!')">💳 EasyPaisa Wallet</div>
        </div>
        <button class="btn" style="background:#444; color:#fff; margin-top:30px;" onclick="handleLogout()">Logout</button>
    </div>

    <script>
        function handleLogin(event) {
            event.preventDefault();
            const username = document.getElementById('username').value;
            const phone = document.getElementById('phone').value;

            if (username && phone) {
                localStorage.setItem('wg_user', username);
                document.getElementById('user-display').innerText = username;
                document.getElementById('login-container').style.display = 'none';
                document.getElementById('dashboard-container').style.display = 'block';
                document.getElementById('wallet-balance').innerText = 'Rs. 500.00';
            }
        }

        function handleLogout() {
            localStorage.removeItem('wg_user');
            document.getElementById('dashboard-container').style.display = 'none';
            document.getElementById('login-container').style.display = 'block';
        }

        window.onload = function() {
            const savedUser = localStorage.getItem('wg_user');
            if (savedUser) {
                document.getElementById('user-display').innerText = savedUser;
                document.getElementById('login-container').style.display = 'none';
                document.getElementById('dashboard-container').style.display = 'block';
                document.getElementById('wallet-balance').innerText = 'Rs. 500.00';
            }
        }
    </script>
</body>
</html>
